name: b2bdash

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-b2b}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-b2b}
      POSTGRES_DB: ${POSTGRES_DB:-b2bdash}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-b2b} -d ${POSTGRES_DB:-b2bdash}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    env_file: [.env]
    environment:
      # Local by default. Set DATABASE_URL in .env to point the stack somewhere
      # else -- deliberately not SUPABASE_DATABASE_URL, so pointing the dev stack
      # at production is a decision rather than a side effect of storing the string.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-b2b}:${POSTGRES_PASSWORD:-b2b}@db:5432/${POSTGRES_DB:-b2bdash}}
      DASHBOARDS_DIR: /srv/dashboards
      SOURCES_FILE: /srv/sources/sources.yaml
      UPLOAD_DIR: /srv/data/uploads
      # local unless STORAGE_BACKEND says otherwise, so development does not push
      # every test upload to the bucket
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      # Off for local work so development needs no Supabase account. The default
      # in config.py is on, so anything that does not say this explicitly is
      # protected -- and the API prints a loud line at boot when it is off.
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      # colima's virtiofs mount does not emit inotify events; poll instead
      WATCHFILES_FORCE_POLLING: "true"
    depends_on:
      db: {condition: service_healthy}
    ports: ["${API_PORT:-8000}:8000"]
    volumes:
      - ./api:/srv/api
      - ./dashboards:/srv/dashboards
      - ./sources:/srv/sources
      - ./data/uploads:/srv/data/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /srv/api --reload-dir /srv/dashboards --reload-dir /srv/sources

  web:
    build: ./web
    environment:
      # the dev server proxies /api so the browser needs no CORS and no origin config
      API_ORIGIN: http://api:8000
      # Vite only exposes VITE_-prefixed vars to the bundle. Both are public by
      # design: the anon key alone reaches the login endpoints and nothing else,
      # because every data route verifies the resulting token server-side.
      VITE_SUPABASE_URL: ${SUPABASE_URL:-}
      VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      VITE_AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
    depends_on: [api]
    ports: ["${WEB_PORT:-5173}:5173"]
    volumes:
      - ./web:/srv/web
      - web_modules:/srv/web/node_modules      # keep the image's install, not the host's
    command: npm run dev

volumes:
  pgdata:
  web_modules:
