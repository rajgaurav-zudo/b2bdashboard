slug: introducer_performance
name: Introducer performance
version: 1
schema: dash_introducer_performance

description: >
  Which recruitment partners used to pay us and stopped — and who to call first
  to win them back. Deposit counts are the revenue proxy; commission value is not
  in either export.

# Grouping dimensions for this dashboard only. Changing them changes nothing elsewhere.
dimensions: [srm_team, srm_owner, country, lifecycle_stage]

# `source` names the uploaded file each table is built from. The files are
# platform-level (see sources/sources.yaml) and shared: another dashboard reading
# the same applications export does not upload it again, and cannot change what
# this one takes out of it.
datasets:
  introducers:
    display_name: Introducers master
    source: introducers
    table: introducers
    natural_key: [partner_name]
    required_columns: ["Partner Name", "Lifecycle Stage"]
  applications:
    display_name: Applications
    source: applications
    table: applications
    # app_uid is the application id when the export has one, otherwise a stable
    # content hash plus occurrence index -- see ingest.py
    natural_key: [app_uid]
    required_columns: ["Application Introducer Name", "Deposit Paid Status"]
