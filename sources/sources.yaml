# The files the platform accepts, independent of any dashboard.
#
# A source is a kind of CRM export. It is uploaded once, archived once, and read
# by every dashboard that declares it. Adding a dashboard that needs the
# applications file does not mean uploading the applications file again.
#
# What belongs here: what the file *is*. What belongs in a dashboard's ingest.py:
# which of its columns that dashboard wants and what they mean. Keep the split --
# it is why a change to one dashboard cannot alter another's numbers.
#
# `context.md` beside this file is the third piece: where a column's *values*
# carry a meaning every dashboard must agree on (course-level categories, the
# three deposit states, the intake period columns). Spec only -- nothing reads
# it at runtime.
#
# `identified_by` is checked against the normalised header before anything is
# stored, so uploading the applications export into the introducers slot is
# refused with a readable reason rather than loading 227k wrong rows. Fragments
# are matched as substrings of a normalised header (lowercased, punctuation and
# stray whitespace collapsed) so a renamed column does not break identification.

introducers:
  display_name: Introducers master
  description: >
    One row per partner. The join key every dashboard uses to attach
    applications to the partner that introduced them.
  identified_by:
    - partner name
    - lifecycle stage

applications:
  display_name: Applications
  description: >
    One row per application. The event table: intake, status, deposit and
    the introducer that brought it.
  identified_by:
    - introducer name
    - deposit paid status

introducer_logs:
  display_name: Introducer activity log
  description: >
    One row per logged interaction with a partner -- a call, a meeting, an email,
    a face-to-face visit -- carrying who logged it, which team owns the partner,
    when it happened and the note whoever made it wrote down.
  identified_by:
    - log type
    - log time
