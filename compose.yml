name: b2bdash

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-b2b}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-b2b}
      POSTGRES_DB: ${POSTGRES_DB:-b2bdash}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-b2b} -d ${POSTGRES_DB:-b2bdash}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-b2b}:${POSTGRES_PASSWORD:-b2b}@db:5432/${POSTGRES_DB:-b2bdash}
      DASHBOARDS_DIR: /srv/dashboards
      UPLOAD_DIR: /srv/data/uploads
      # colima's virtiofs mount does not emit inotify events; poll instead
      WATCHFILES_FORCE_POLLING: "true"
    depends_on:
      db: {condition: service_healthy}
    ports: ["${API_PORT:-8000}:8000"]
    volumes:
      - ./api:/srv/api
      - ./dashboards:/srv/dashboards
      - ./data/uploads:/srv/data/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build: ./web
    environment:
      # the dev server proxies /api so the browser needs no CORS and no origin config
      API_ORIGIN: http://api:8000
    depends_on: [api]
    ports: ["${WEB_PORT:-5173}:5173"]
    volumes:
      - ./web:/srv/web
      - web_modules:/srv/web/node_modules      # keep the image's install, not the host's
    command: npm run dev

volumes:
  pgdata:
  web_modules:
